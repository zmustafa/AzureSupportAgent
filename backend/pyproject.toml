[project]
name = "azsupagent-backend"
version = "0.1.0"
description = "Azure Support Agent - backend API + orchestrator"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "asyncpg>=0.30",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "redis>=5.2",
    "httpx>=0.27",
    "sse-starlette>=2.1",
    "openai>=1.54",
    "mcp>=1.28.1,<3",
    "python-multipart>=0.0.12",
    "croniter>=2.0",
    "tzdata>=2024.1",
    "boto3>=1.35",
    "asyncssh>=2.14",
    "azure-servicebus>=7.12",
    "argon2-cffi>=23.1",
    "PyJWT>=2.10",
    "cryptography>=42.0",
    "lxml>=5.0",
    "xhtml2pdf>=0.2.17",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-xdist>=3.8",
    "ruff>=0.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.setuptools.package-data]
app = ["agent/skills/*/SKILL.md"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Security rules are ON permanently, so a NEW violation fails instead of being
# discovered during a pre-deploy sweep.
#   S      = flake8-bandit  (the security ruleset)
#   ASYNC  = async antipatterns
extend-select = ["S", "ASYNC"]

# Every ignore below was individually reviewed on 2026-07-31 against the running code,
# and cross-checked with the 2026-06-27 full scan (.security/SECURITY_SCAN_REPORT.md).
# DELIBERATELY NOT IGNORED: S602/S603/S607 (subprocess), S608 (SQL/KQL string building),
# S301/S302 (pickle), S307 (eval), S321 (ftp), S501 (TLS verify off) — those must keep
# failing, because they are the rules that would catch a real regression in this codebase.
ignore = [
    # Type-narrowing assertions only (`assert result is not None`, `assert proc.stdout`).
    # Verified: none performs a security check, so stripping under `python -O` yields an
    # AttributeError rather than an auth bypass.
    "S101",
    # URL/þconstant names that merely LOOK like credentials, e.g. `_TOKEN_URL`, and the
    # `secret_kind` keyword argument. No literal secrets. Confirmed 2026-06-27.
    "S105", "S106",
    # try/except/pass and try/except/continue on deliberate best-effort paths (cache
    # warmers, token refresh retry, cleanup that "must never raise"). These already carry
    # `# noqa: BLE001` with a written reason at each site.
    "S110", "S112",
    # `random` is used only for exponential-backoff jitter, never for tokens or secrets.
    # Confirmed 2026-06-27.
    "S311",
    # SHA-1 / MD-family: filesystem cache keys (rbac/cache.py) and the X.509 `x5t`
    # thumbprint in azure/credentials.py, which RFC 7515 REQUIRES to be SHA-1. Not a
    # cryptographic signature. Confirmed 2026-06-27.
    "S303", "S324",
    # "0.0.0.0" appears as a catalog keyword string and as the container bind address,
    # which is correct inside a container behind ingress. Confirmed 2026-06-27.
    "S104",
    # A `timeout` parameter on an async def is deliberate API design here, not a missing
    # cancellation scope.
    "ASYNC109",
    # pathlib in async context: local .data JSON registry reads, not blocking network I/O.
    "ASYNC240",
]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately assert, and use obviously-fake credentials as fixtures.
"tests/*" = ["S101", "S105", "S106", "S108"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# ALWAYS run pytest with cwd = backend/. Run it from the repo root and pytest picks a
# different rootdir, silently DROPS the addopts below, and executes the heavy/live suites -
# ~58 spurious failures in files unrelated to your change. Green looks like
# "N passed, 604 deselected"; "0 deselected" means you're in the wrong directory.
#
# Fast default run: the heavier / lower-frequency suites are auto-tagged ``slow`` in
# tests/conftest.py and excluded by default so `pytest` builds & runs fast. Run the full
# suite with `pytest -m ""` (or just the heavy ones with `pytest -m slow`).
#
# PARALLEL (pytest-xdist) - measured on a 24-core box, 2026-07-24:
#     pytest -n 8 --dist loadfile            fast suite   41.7s -> 17.5s  (2.4x)
#     pytest -m "" -n 12 --dist loadfile     full suite  130.9s -> 33.3s  (3.9x)
# `--dist loadfile` keeps every test in a file on ONE worker, so module-level state and
# intra-file ordering behave exactly as they do serially (verified: 3 consecutive clean
# runs). `--dist load` splits per test and measured SLOWER (27.7s) - don't use it.
# Past -n 12 it gets slower again: each worker re-imports the app (~3.5s), and the longest
# single file is the floor no matter how many workers you add.
#
# `-n` is deliberately NOT in addopts: spawning 8 workers costs more than it saves when you
# run one file or one test in the inner loop, and it breaks breakpoints/pdb.
addopts = "-m 'not slow'"
markers = [
    "slow: heavier or lower-frequency suite, excluded from the fast default run",
]
