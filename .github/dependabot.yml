version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # The microsoft-kiota-* packages are a VERSION-LOCKED FAMILY: every one is pinned
      # to the same version and they require each other exactly. Bumping one alone is
      # unmergeable -- pip resolution fails outright. Group them so they move together.
      microsoft-kiota:
        patterns:
          - "microsoft-kiota-*"
      msgraph:
        patterns:
          - "msgraph-*"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # @tiptap/* is a VERSION-LOCKED FAMILY, like microsoft-kiota-* above: each package
      # peer-depends on @tiptap/core at an EXACT version, so bumping any one of them
      # alone fails npm resolution with ERESOLVE. Group them (the pattern also catches
      # the transitive @tiptap/core) so the family migrates in a single PR.
      tiptap:
        patterns:
          - "@tiptap/*"
    ignore:
      # react-router GHSA-qwww-vcr4-c8h2 is RSC-mode-only. This is a client-only
      # Vite BrowserRouter SPA with no RSC, no SSR and no server actions, so the
      # advisory is not reachable. The only "fix" is a major bump to 8.x.
      # Re-evaluate if SSR/RSC is ever adopted. Major bumps still surface here.
      - dependency-name: "react-router-dom"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/e2e"
    schedule:
      interval: "monthly"

  # Base images are DIGEST-pinned. What is wanted here is a refreshed digest for the SAME
  # tag, so the pin keeps inheriting upstream security patches. Version updates are
  # ignored: bumping the tag itself (node 22 -> 25, python 3.12 -> 3.14) is a runtime
  # migration, not a patch, and must be a deliberate decision. Digest updates are not a
  # "version-update" type, so they still come through.
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/backend"
      - "/frontend"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"

  # Matters once CI exists: a compromised third-party action runs with repo credentials.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
