version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # The microsoft-kiota-* packages are a VERSION-LOCKED FAMILY: every one is pinned
      # to the same version and they require each other exactly. Bumping one alone is
      # unmergeable -- pip resolution fails outright. Group them so they move together.
      microsoft-kiota:
        patterns:
          - "microsoft-kiota-*"
      msgraph:
        patterns:
          - "msgraph-*"
    ignore:
      # mcp 2.0 is a TRANSPORT REWRITE, not a routine major: it swaps the httpx stack for
      # httpx2/httpcore2 and splits the schema out into a new mcp-types package. pip resolves
      # it cleanly anyway, so a green install proves nothing -- fastmcp-slim declares
      # `mcp<2.0` only under its client/server/mcp EXTRAS, which are not installed. Meanwhile
      # third_party/entraid-mcp-server pins `mcp[cli]<2` and is built into its OWN venv, so
      # taking 2.x would split the two halves of the MCP integration across incompatible
      # majors while app/mcp/client.py uses ClientSession/stdio_client directly.
      # Scoped to major ONLY so 1.x security patches (e.g. CVE-2026-59950) still arrive.
      - dependency-name: "mcp"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # @tiptap/* is a VERSION-LOCKED FAMILY, like microsoft-kiota-* above: each package
      # peer-depends on @tiptap/core at an EXACT version, so bumping any one of them
      # alone fails npm resolution with ERESOLVE. Group them (the pattern also catches
      # the transitive @tiptap/core) so the family migrates in a single PR.
      tiptap:
        patterns:
          - "@tiptap/*"
    ignore:
      # react-router GHSA-qwww-vcr4-c8h2 is RSC-mode-only. This is a client-only
      # Vite BrowserRouter SPA with no RSC, no SSR and no server actions, so the
      # advisory is not reachable. The only "fix" is a major bump to 8.x.
      # Re-evaluate if SSR/RSC is ever adopted. Major bumps still surface here.
      - dependency-name: "react-router-dom"
        update-types: ["version-update:semver-major"]
      # react-grid-layout v2 is a REWRITE that silently breaks the Monitor dashboard.
      # Evaluated and rejected in PR #44 (release 8): the call-site migration is
      # mechanical (v2 redefines `Layout` as the ARRAY and `LayoutItem` as the element,
      # and moves the v1 flat-props API to the `react-grid-layout/legacy` subpath) and it
      # TYPE-CHECKS AND BUILDS 100% CLEAN -- yet at runtime v2 applied neither grid
      # snapping nor vertical compaction, producing 9 overlapping tile pairs on a 12-widget
      # dashboard where v1.5.4 produces 0. Do not take this major on a green build alone;
      # it must be re-verified by driving the dashboard in a browser ABOVE the lg (1200px)
      # breakpoint, since below it every tile is full-width and the breakage is invisible.
      # Scoped to major ONLY so 1.x patch/security updates still arrive.
      - dependency-name: "react-grid-layout"
        update-types: ["version-update:semver-major"]
      # @types/react-grid-layout is paired with the above. Its v2 is a DEPRECATED STUB
      # (react-grid-layout v2 ships its own types), so a v2 bump here is never wanted on
      # its own -- it only makes sense as part of a deliberate v2 migration, which would
      # drop this dependency entirely rather than bump it.
      - dependency-name: "@types/react-grid-layout"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/e2e"
    schedule:
      interval: "monthly"

  # Base images are DIGEST-pinned. What is wanted here is a refreshed digest for the SAME
  # tag, so the pin keeps inheriting upstream security patches. Version updates are
  # ignored: bumping the tag itself (node 22 -> 25, python 3.12 -> 3.14) is a runtime
  # migration, not a patch, and must be a deliberate decision. Digest updates are not a
  # "version-update" type, so they still come through.
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/backend"
      - "/frontend"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"

  # Matters once CI exists: a compromised third-party action runs with repo credentials.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
