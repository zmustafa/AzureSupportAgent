name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1" # weekly full sweep
  workflow_dispatch:

permissions:
  contents: read
  security-events: write # required to upload SARIF to the Security tab

jobs:
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # REQUIRED. The default shallow clone scans only the tip, which is the most
          # common reason secret scanning silently does nothing.
          fetch-depth: 0
      - name: gitleaks (full history)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
      # Run the container directly rather than trufflesecurity/trufflehog@main.
      # That action derives BASE/HEAD from the event and hard-fails with "BASE and HEAD
      # commits are the same. TruffleHog won't scan anything" whenever they coincide --
      # which is a scan that never ran being reported as a security failure. Scanning the
      # checked-out repo explicitly is deterministic and matches what is run locally.
      #
      # --results=verified normally means a hit is a live credential rather than a pattern
      # match. DO NOT TRUST THAT FOR EVERY DETECTOR -- the Lob detector disproves it. A Lob
      # API key is literally `test_` + 35 chars, which is also the shape of a long pytest
      # function name, so `test_auto_chart_type_picks_by_data_shape` matches. Worse, Lob's
      # verifier returned Verified=true for all of them, so 96 pytest names in
      # backend/tests were reported as live secrets and failed this job for two days.
      # Reproduce: `trufflehog filesystem backend/tests --results=verified` -> 315 Lob hits.
      #
      # Excluding the detector (we do not use Lob anywhere) is scoped, NOT a mute-all:
      # verified with the same flag, a planted RSA private key is still reported by the
      # PrivateKey detector, and the full-history scan still covers all 8652 chunks.
      - name: TruffleHog (verified secrets only)
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            trufflesecurity/trufflehog:latest \
            git file:///repo --results=verified --fail --no-update \
            --exclude-detectors=Lob

  codeql:
    name: codeql
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3

  sast:
    name: ruff + bandit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pin ruff to the SAME version backend/requirements.txt pins, read from that file so
      # there is one source of truth. `pip install ruff` (unpinned) is what broke this job:
      # the repo pins 0.15.16, CI silently installed 0.16.1, and 0.16 hugely expanded the
      # DEFAULT rule set (0.15 shipped E/F; 0.16 adds B, UP, RUF, I, SIM, FURB, ISC...).
      # The gate then reported 2294 findings where a developer running the pinned version
      # locally saw 90 -- a lint gate that disagrees with every workstation is worthless.
      - name: install pinned linters
        run: |
          ruff_pin="$(grep -E '^ruff==' backend/requirements.txt)"
          echo "using $ruff_pin"
          pip install "$ruff_pin" 'bandit==1.9.4'
      # These are a PASS/FAIL gate, not a code-scanning feed. Uploading their SARIF put
      # 149 alerts in the Security tab that the reviewed `ignore` list in
      # backend/pyproject.toml had already dispositioned -- CLI `--select` OVERRIDES that
      # list, so CI re-reported findings that are zero locally. Code scanning is for
      # CodeQL's dataflow results; lint belongs in the job result.
      - name: ruff security rules
        run: |
          # No --select: let backend/pyproject.toml decide, so the justified ignores apply.
          # Filter to security codes so ordinary lint does not gate the security job.
          ruff check backend/app --output-format json > ruff.json || true
          python - <<'PY'
          import json, re, sys

          SECURITY = {"S", "ASYNC"}  # flake8-bandit, and async antipatterns

          def group(code):
              """"S608" -> "S", "ASYNC109" -> "ASYNC", "SIM102" -> "SIM".

              Compare the ALPHABETIC PREFIX, never str.startswith: "SIM102".startswith("S")
              is True, so the previous filter counted all 36 flake8-simplify findings as
              security findings and failed the job on style rules.
              """
              m = re.match(r"[A-Z]+", code or "")
              return m.group(0) if m else ""

          findings = [f for f in json.load(open("ruff.json")) if group(f.get("code")) in SECURITY]
          print(f"{len(findings)} security finding(s)")
          for f in findings[:25]:
              print(f"  {f['code']} {f['filename']}:{f['location']['row']}")
          sys.exit(1 if findings else 0)
          PY
      # A gate that selects nothing passes everything, and looks identical in the UI to a
      # gate that found nothing. Plant a known S-rule violation and require ruff to flag it.
      - name: prove the security ruleset is live
        run: |
          mkdir -p backend/_ruff_sentinel
          printf 'import subprocess\nsubprocess.call("ls", shell=True)\n' > backend/_ruff_sentinel/probe.py
          ruff check backend/_ruff_sentinel --output-format json > sentinel.json || true
          rm -rf backend/_ruff_sentinel
          python - <<'PY'
          import json, re, sys
          codes = sorted({f.get("code") or "" for f in json.load(open("sentinel.json"))})
          hits = [c for c in codes if re.fullmatch(r"S\d+", c)]
          if not hits:
              sys.exit(
                  "flake8-bandit is NOT enabled for backend/ -- this gate would pass on "
                  f"anything. Sentinel produced: {codes}"
              )
          print(f"security ruleset live; sentinel flagged {hits}")
          PY
      # ruff's `S` ruleset IS flake8-bandit, and the ruff step above covers backend/app
      # only. Bandit's added value is third_party/ -- the vendored MCP server, which ruff
      # never looks at and which the Dockerfile COPYs into the image. Both roots are clean.
      #
      # --exclude is load-bearing. A developer's third_party/entraid-mcp-server/.venv holds
      # ~17k site-packages files; scanning those reports 266 findings (18 HIGH) that do not
      # exist in the repository. git tracks 21 .py files under third_party and
      # .dockerignore keeps the venv out of the image, so those findings are pure local
      # noise -- but they are what a naive local run produces, and a baseline recorded from
      # one is wrong by three orders of magnitude. Note bandit does NOT honour `**/` here:
      # `*/.venv/*` excludes, `**/.venv` is silently ignored.
      - name: bandit
        run: |
          bandit -r backend/app third_party -ll -q -f json -o bandit.json \
            --exclude '*/.venv/*,*/site-packages/*' || true
          python - <<'PY'
          import json, subprocess, sys

          report = json.load(open("bandit.json"))
          results = report["results"]
          scanned = [k for k in report.get("metrics", {}) if k != "_totals"]
          tracked = [
              p
              for p in subprocess.run(
                  ["git", "ls-files", "backend/app", "third_party"],
                  capture_output=True, text=True, check=True,
              ).stdout.split()
              if p.endswith(".py")
          ]

          # A scan of NOTHING and a clean scan both print "0 findings". That is not
          # hypothetical: a baseline measured against a local virtualenv passed in CI
          # against a tree that contained none of those files, and looked green.
          print(f"bandit scanned {len(scanned)} file(s); git tracks {len(tracked)} .py file(s)")
          if len(scanned) < len(tracked):
              sys.exit(
                  f"bandit only scanned {len(scanned)} of {len(tracked)} tracked files -- "
                  "the exclude pattern or the checkout is wrong, not the code"
              )

          for r in results:
              print(f"  {r['issue_severity']} {r['test_id']} {r['filename']}:{r['line_number']}")
          print(f"{len(results)} finding(s) at -ll")
          sys.exit(1 if results else 0)
          PY

  deps:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit -r backend/requirements.txt
      - name: pip-audit (vendored Entra MCP server)
        run: pip-audit -r third_party/entraid-mcp-server/requirements.txt
        continue-on-error: true # vendored upstream; triage, don't block
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      # NOTE: 2 high advisories are knowingly accepted here - react-router
      # GHSA-qwww-vcr4-c8h2 is RSC-mode-only and this is a client-only BrowserRouter
      # SPA with no RSC/SSR/server actions. Re-evaluate if SSR is ever adopted.
      - run: npm audit --prefix frontend --audit-level=critical

  container:
    name: image scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t scan-target:ci .
      - name: trivy (secrets in layers)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: scan-target:ci
          scanners: secret
          exit-code: "1"
      - name: trivy (vulnerabilities)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: scan-target:ci
          # --ignore-unfixed: only file alerts for CVEs that HAVE an upstream patch.
          # Without it ~330 unpatchable Debian base-OS CVEs land in the Security tab, where
          # they cannot be acted on and bury the findings that can. They are still detected
          # and still reported in the deploy gate's image scan, which is where the action
          # (rebuild the image) actually lives.
          ignore-unfixed: true
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy.sarif

  iac:
    name: iac scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bridgecrewio/checkov-action@master
        with:
          directory: deploy
          framework: bicep
          output_format: sarif
          output_file_path: checkov.sarif
        continue-on-error: true
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: checkov.sarif
