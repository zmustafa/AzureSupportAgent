name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: backend pytest
    runs-on: ubuntu-latest
    env:
      # The suite runs against SQLite, matching local development. Without this the
      # app falls back to the Postgres default in app/core/config.py, and every test
      # that starts the application lifespan spends its timeout failing to reach
      # 127.0.0.1:5432 -- ~2000 errors and a 22-minute run rather than a clear failure.
      #
      # Local machines get these from a gitignored .env, which is exactly why this
      # only ever broke in CI. Set them explicitly here so the workflow does not
      # depend on ambient configuration it cannot see.
      ENVIRONMENT: local
      DATABASE_URL: "sqlite+aiosqlite:///./.data/app.db"
      # The LLM tests mock every response, but the provider client validates that a key is
      # PRESENT at construction. Note the variable is LLM_API_KEY (pydantic-settings maps
      # Settings.llm_api_key), NOT OPENAI_API_KEY - the client is built from app config, so
      # setting the vendor's own variable has no effect. This value is never sent anywhere.
      LLM_API_KEY: "sk-not-a-real-key-tests-mock-all-responses"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: pytest
        # working-directory is NOT cosmetic. `addopts = "-m 'not slow'"` lives in
        # backend/pyproject.toml. Running from the repo root picks a different rootdir,
        # silently loses that config, and executes the heavy/live suite that needs real
        # Azure + network -> ~58 spurious failures. Green looks like "N passed, M deselected"
        # with M non-zero.
        #
        # Deliberately NOT running `alembic upgrade head` here: the app creates its schema on
        # startup, and migration 0003 fails on a fresh SQLite database with "table
        # alert_manager_changes already exists". That is a real, pre-existing bug in the
        # migration chain on SQLite - it does not affect production (Postgres) and does not
        # block the suite, which passes without it. Tracked separately.
        working-directory: backend
        run: |
          mkdir -p .data
          python -m pytest -q

  frontend:
    name: frontend typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        # `npm --prefix <dir>` works, but `npx --prefix <dir>` does NOT scope the tool --
        # tsc receives no input files, prints its help text and the check passes (or fails)
        # without ever type-checking anything. Run from the directory instead.
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      # `vite build` fails on unused top-level symbols (TS6133), so this catches
      # dead code the dev server tolerates.
      - run: npm run build

  hooks:
    name: conditional hooks check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: no conditionally-called React hooks
        run: python frontend/scripts/find_conditional_hooks.py frontend/src/components
        continue-on-error: true

  docs:
    name: docs coverage + links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      # Regenerate the inventory from application source rather than trusting the committed
      # copy. If a nav registry moved, extraction fails loudly here instead of quietly
      # shrinking the inventory, which would make undocumented features look documented.
      - name: feature inventory is current
        working-directory: docs
        run: |
          python _feature_inventory.py
          git diff --exit-code -- _feature_inventory.json
      # Enforces the promise made on /technical/documentation-regeneration/: every route,
      # navigation item, permission and connector maps to a feature reference AND a how-to.
      - name: docs structure and source coverage
        working-directory: docs
        run: python _validate_public_docs.py
      - name: internal links resolve
        working-directory: docs
        run: python _check_links.py
